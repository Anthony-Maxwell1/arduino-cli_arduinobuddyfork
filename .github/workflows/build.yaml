name: Build Go release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Setup Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # 3) Cache Go modules (speeds up builds)
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # 4) Install dependencies
      - name: Run go mod tidy
        run: go mod tidy

      - name: Install project
        run: go install ./...

      # 5) Run project build script (handles gomobile, env, etc.)
      - name: Run build script
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      # 6) Verify dist folder exists
      - name: Verify dist output
        run: |
          if [ ! -d "dist" ]; then
            echo "dist/ directory not found. Build likely failed."
            exit 1
          fi

      # 7) Zip dist contents (optional but recommended)
      - name: Package dist artifacts
        run: |
          cd dist
          zip -r ../release-artifacts.zip .

      # 8) Create GitHub release + upload artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Automated Go build ${{ github.run_number }}"
          files: |
            release-artifacts.zip
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
